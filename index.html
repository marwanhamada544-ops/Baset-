<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر هدوم أونلاين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>أهلاً بك في متجر الهدوم</h1>
        <nav>
            <a href="#products">المنتجات</a>
            <a href="#contact">تواصل معنا</a>
        </nav>
    </header>

    <section id="products">
        <h2>منتجاتنا</h2>
        <div class="product" data-price="120">
            <img src="https://via.placeholder.com/150" alt="هدوم 1">
            <h3>تيشيرت أبيض</h3>
            <p>السعر: 120 جنيه</p>
            <button class="buy-btn">اشتري الآن</button>
        </div>
        <div class="product" data-price="150">
            <img src="https://via.placeholder.com/150" alt="هدوم 2">
            <h3>بنطلون جينز</h3>
            <p>السعر: 150 جنيه</p>
            <button class="buy-btn">اشتري الآن</button>
        </div>
    </section>

    <section id="contact">
        <h2>تواصل معنا</h2>
        <p>للطلبات أو الاستفسارات راسلنا على <a href="mailto:info@example.com">info@example.com</a></p>
    </section>

    <footer>
        <p>© 2026 متجر هدوم</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
